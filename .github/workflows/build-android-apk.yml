name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "microdroid-broadcaster/android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microdroid-broadcaster/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"

          # Ensure sdkmanager has the current command-line tools installed.
          sdkmanager --sdk_root="$SDK_ROOT" "cmdline-tools;latest"

          # Accept licenses after the command-line tools are available.
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses

          # Install the SDK components required by this project.
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: microdroid-broadcaster-debug-apk
          path: microdroid-broadcaster/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
